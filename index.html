<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>allday</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fff}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden}
  iframe.active{visibility:visible;z-index:1}
</style>
</head>
<body>
<iframe id="fr-home" class="active" src="/_pages/home.html"></iframe>
<iframe id="fr-product" src="/_pages/product.html"></iframe>
<iframe id="fr-api" src="/_pages/api.html"></iframe>
<script>
(function(){
  var frames = { home: document.getElementById('fr-home'), product: document.getElementById('fr-product'), api: document.getElementById('fr-api') };
  var paths = { home: '/', product: '/product', api: '/api' };
  function routeFromPath(p){
    if (p === '/product' || p === '/product/') return 'product';
    if (p === '/api' || p === '/api/') return 'api';
    return 'home';
  }
  function show(route, push, hash){
    Object.keys(frames).forEach(function(k){ frames[k].classList.toggle('active', k === route); });
    if (push) history.pushState({ route: route }, '', paths[route] + (hash ? '#' + hash : ''));
    if (hash) {
      setTimeout(function(){ frames[route].contentWindow.postMessage({ __allday_scroll: true, hash: hash }, '*'); }, 60);
    }
  }
  window.addEventListener('popstate', function(){ show(routeFromPath(location.pathname), false); });
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || !d.__allday_nav) return;
    show(d.route, true, d.hash);
  });
  show(routeFromPath(location.pathname), false, (location.hash || '').replace('#',''));
})();
</script>
</body>
</html>
